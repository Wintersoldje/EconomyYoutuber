services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./backend/output:/app/output
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    command: >
      bash -lc "
      apt-get update && apt-get install -y ffmpeg && 
      pip install --no-cache-dir -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: >
      sh -lc "
      npm install &&
      npm run dev
      "
    depends_on:
      - backend
